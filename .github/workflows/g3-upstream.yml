name: Verify G3 nonlinear response against original Operaattori
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'experiments/nonlinear.py'
      - 'experiments/fast_reference.py'
      - 'data/nonlinear_results.json'
      - '.github/workflows/g3-upstream.yml'
      - 'tests/test_nonlinear.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g3-original:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out MondaySihti
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out original pinned Operaattori
        uses: actions/checkout@v4
        with:
          repository: anttiluode/Operaattori
          ref: f2398939dc2ef2ec829093953c20637c74e82cd0
          path: upstream/Operaattori
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency
        run: python -m pip install 'numpy==2.1.3'
      - name: Assert original source identity
        run: |
          test "$(git -C upstream/Operaattori rev-parse HEAD)" = 'f2398939dc2ef2ec829093953c20637c74e82cd0'
          test "$(git -C upstream/Operaattori hash-object reduced/causal_graph_circuit.py)" = '433621a1a5a39a6ea3c2dcf47082c8e2a9085a47'
          echo 'Original CausalGraphCircuit source hash confirmed.'
      - name: Tests, including no leakage and matched budgets
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
      - name: Recompute EVERY frozen evaluation history using original nonlinear runtime
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m experiments.nonlinear --operaattori upstream/Operaattori --check --output data/nonlinear_results.json
          echo 'PASS: all original solver histories match independent reference and frozen held-out errors.'
