name: Reproduce bridge against Operaattori
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned original Operaattori
        uses: actions/checkout@v4
        with:
          repository: anttiluode/Operaattori
          ref: f2398939dc2ef2ec829093953c20637c74e82cd0
          path: upstream/Operaattori
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy==2.1.3'
      - name: Verify upstream identity
        run: |
          test "$(git -C upstream/Operaattori rev-parse HEAD)" = 'f2398939dc2ef2ec829093953c20637c74e82cd0'
          echo "upstream file blob $(git -C upstream/Operaattori hash-object reduced/causal_graph_circuit.py)"
          test "$(git -C upstream/Operaattori hash-object reduced/causal_graph_circuit.py)" = '433621a1a5a39a6ea3c2dcf47082c8e2a9085a47'
      - name: Run independent unit tests
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
      - name: Run exact upstream passive compiler and compare saved benchmark
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/bridge.py --operaattori upstream/Operaattori --check --output data/results.json
